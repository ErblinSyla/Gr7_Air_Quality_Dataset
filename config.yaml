# Pipeline configuration: paths, station references, quality rules and parameters of every preprocessing step.

paths:
  raw: data/raw/E1a
  metadata: data/raw/metadata
  data: data
  reports: reports

stations:
  town_centroids:
    XK0001A: {town: "Pristina", lat: 42.663, lon: 21.166}
    XK0002A: {town: "Pristina", lat: 42.663, lon: 21.166}
    XK0003A: {town: "Drenas", lat: 42.625, lon: 20.893}
    XK0004A: {town: "Mitrovica", lat: 42.891, lon: 20.866}
    XK0005A: {town: "Peja", lat: 42.659, lon: 20.289}
    XK0006A: {town: "Prizren", lat: 42.214, lon: 20.740}
    XK0007A: {town: "Brezovica", lat: 42.200, lon: 21.020}
    XK0008A: {town: "Hani i Elezit", lat: 42.149, lon: 21.297}
    XK0009A: {town: "Gjilan", lat: 42.464, lon: 21.469}
    XK0010A: {town: "Palaj (Obiliq)", lat: 42.680, lon: 21.050}
    XK0011A: {town: "Obiliq", lat: 42.687, lon: 21.070}
    XK0012A: {town: "Dardhishte (Obiliq)", lat: 42.660, lon: 21.080}
  max_distance_km: 10

expected:
  rows: 4261594
  sampling_points: 93
  stations: 12

time:
  raw_tz: "Etc/GMT-1"
  local_tz: "Europe/Belgrade"
  heating_months: [10, 11, 12, 1, 2, 3, 4]
  fit_until_year: 2023

pollutants:
  1:    {name: "SO2",   unit: "µg/m³", physical_max: 2500, neg_zero: -2.0}
  5:    {name: "PM10",  unit: "µg/m³", physical_max: 1500, neg_zero: -2.0}
  6001: {name: "PM2_5", unit: "µg/m³", physical_max: 1000, neg_zero: -2.0}
  7:    {name: "O3",    unit: "µg/m³", physical_max: 600,  neg_zero: -2.0}
  8:    {name: "NO2",   unit: "µg/m³", physical_max: 1000, neg_zero: -2.0}
  9:    {name: "NOx",   unit: "µg/m³", physical_max: 3000, neg_zero: -2.0, ppb_to_ugm3: 1.912}
  10:   {name: "CO",    unit: "mg/m³", physical_max: 60,   neg_zero: -0.1}
  38:   {name: "NO",    unit: "µg/m³", physical_max: 2000, neg_zero: -2.0}

quality:
  sentinels: [-9900]
  absurd_threshold: 1000000.0
  stuck_min_hours: 6
  stuck_zero_plausible: ["CO", "O3", "SO2", "NO"]
  spike_quantile: 0.999
  pm_tolerance: {abs: 5.0, rel: 0.10}
  no_to_no2: 1.53
  nox_ppb_ratio: [0.50, 0.55]
  nox_tolerance: 0.20
  unit_check_tolerance: 0.05
  outlier_iqr_k: 1.5
  analyzer_change:
    to_null: ["NO", "NO2"]
    flag_only: ["CO", "SO2"]
    approx_date: "2019-11-01"
    expected_year: 2019

missing:
  max_gap_h: 24
  eval_gap_lengths_h: [1, 3, 6, 12, 24]
  eval_gaps_per_series: 150
  near_real_gap_h: 24
  seed: 42

aggregation:
  min_hours_per_day: 18
  min_days_per_month_frac: 0.75
  min_annual_coverage: 0.90

sampling:
  fraction: 0.10
  strata: ["station_id", "season"]
  compare_pollutants: ["PM2_5", "PM10", "NO2", "O3"]
  seed: 42

eaqi:
  source: "https://airindex.eea.europa.eu/AQI/index.html"
  labels: ["good", "fair", "moderate", "poor", "very poor", "extremely poor"]
  bins: {PM2_5: [5, 15, 50, 90, 140]}

features:
  lags_h: [1, 24]
  rolling_h: 24
  lag_pollutants: ["PM2_5", "PM10", "NO2"]
  n_bins: 5
  selection_sample: 50000
  selection_min_gain: 0.001
  tree_max_depth: 8
  seed: 42

reduction:
  corr_threshold: 0.9
  pca_variance: 0.90

binarization:
  pm10_daily_limit: 50
  pm25_daily_who: 15

chi2:
  alpha: 0.05

# Phase II: outlier detection (KNN distance, LOF, K-Means, Mahalanobis, one-class SVM) on station-day vectors
# of the daily means.
outliers:
  features: ["PM10", "PM2_5", "NO2", "O3", "SO2", "CO"]
  threshold_percentile: 99            # a score above this percentile is an outlier (top 1%)
  threshold_percentiles: [90, 95, 97.5, 99, 99.5]
  injected_share: 0.01                # known anomalies added only to an evaluation copy of the data
  injected_factor: [2.0, 5.0]         # one pollutant of a real day multiplied by a factor in this range
  eval_seeds: [42, 7, 2024]           # every setting is evaluated on three different injections
  knn_k: [3, 5, 10, 15, 20, 30, 50]
  knn_metrics: ["euclidean", "manhattan"]
  knn_scores: ["mean", "kth"]          # mean distance to the k neighbours (exercise) or distance to the k-th (lecture)
  lof_k: [5, 10, 15, 20, 30, 50, 100]
  kmeans_k: [2, 3, 4, 5, 6, 8, 10]
  ocsvm_gamma: [0.05, 0.1, 0.5, 1.0, 2.0]
  ocsvm_nu: [0.01, 0.05]
  iforest_max_samples: [256, 1024, 4096, 8192]  # Isolation Forest (comparison method, not in the lectures)
  iforest_trees: [100, 300]
  sensitivity_shares: [0.005, 0.01, 0.02]  # injected shares for the threshold sensitivity check
  sensitivity_percentiles: [97, 98, 99, 99.5]
  lof_limits: [1.5, 2.0]              # common LOF limits for the real-data estimate of the outlier share
  chi2_alpha: [0.01, 0.001]           # significance levels of the χ² threshold for the Mahalanobis distance
  contextual_lof_k: [10, 20, 50, 100]      # o2: n_neighbors of LOF on the context residuals
  spike_share: 0.001                  # o3: share of the hours that get an injected spike
  spike_factor: [3.0, 6.0]
  spike_t: [10, 20, 30, 50, 80]        # threshold in robust standard deviations of the hourly changes
  stuck_runs: 200                     # injected frozen-sensor runs
  stuck_length: [3, 24]               # hours
  stuck_min_len: [3, 4, 6, 12]        # minimum run length that is flagged
  drift_events: 30
  drift_days: 30
  drift_factor: 2.0                   # the value doubles over drift_days
  drift_window: [3, 7, 14]            # days
  drift_t: [3, 4, 5]
  drift_baseline_days: 60                    # a reliable outlier is flagged by at least this many of the five methods
  seed: 42
