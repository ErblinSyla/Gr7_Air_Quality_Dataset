# Pipeline configuration: paths, station references, quality rules and parameters of every preprocessing step.

paths:
  raw: data/raw/E1a
  metadata: data/raw/metadata
  data: data
  reports: reports

stations:
  town_centroids:
    XK0001A: {town: "Pristina", lat: 42.663, lon: 21.166}
    XK0002A: {town: "Pristina", lat: 42.663, lon: 21.166}
    XK0003A: {town: "Drenas", lat: 42.625, lon: 20.893}
    XK0004A: {town: "Mitrovica", lat: 42.891, lon: 20.866}
    XK0005A: {town: "Peja", lat: 42.659, lon: 20.289}
    XK0006A: {town: "Prizren", lat: 42.214, lon: 20.740}
    XK0007A: {town: "Brezovica", lat: 42.200, lon: 21.020}
    XK0008A: {town: "Hani i Elezit", lat: 42.149, lon: 21.297}
    XK0009A: {town: "Gjilan", lat: 42.464, lon: 21.469}
    XK0010A: {town: "Palaj (Obiliq)", lat: 42.680, lon: 21.050}
    XK0011A: {town: "Obiliq", lat: 42.687, lon: 21.070}
    XK0012A: {town: "Dardhishte (Obiliq)", lat: 42.660, lon: 21.080}
  max_distance_km: 10

expected:
  rows: 4261594
  sampling_points: 93
  stations: 12

time:
  raw_tz: "Etc/GMT-1"
  local_tz: "Europe/Belgrade"
  heating_months: [10, 11, 12, 1, 2, 3, 4]
  fit_until_year: 2023

pollutants:
  1:    {name: "SO2",   unit: "µg/m³", physical_max: 2500, neg_zero: -2.0}
  5:    {name: "PM10",  unit: "µg/m³", physical_max: 1500, neg_zero: -2.0}
  6001: {name: "PM2_5", unit: "µg/m³", physical_max: 1000, neg_zero: -2.0}
  7:    {name: "O3",    unit: "µg/m³", physical_max: 600,  neg_zero: -2.0}
  8:    {name: "NO2",   unit: "µg/m³", physical_max: 1000, neg_zero: -2.0}
  9:    {name: "NOx",   unit: "µg/m³", physical_max: 3000, neg_zero: -2.0, ppb_to_ugm3: 1.912}
  10:   {name: "CO",    unit: "mg/m³", physical_max: 60,   neg_zero: -0.1}
  38:   {name: "NO",    unit: "µg/m³", physical_max: 2000, neg_zero: -2.0}

quality:
  sentinels: [-9900]
  absurd_threshold: 1000000.0
  stuck_min_hours: 6
  stuck_zero_plausible: ["CO", "O3", "SO2", "NO"]
  spike_quantile: 0.999
  pm_tolerance: {abs: 5.0, rel: 0.10}
  no_to_no2: 1.53
  nox_ppb_ratio: [0.50, 0.55]
  nox_tolerance: 0.20
  unit_check_tolerance: 0.05
  outlier_iqr_k: 1.5
  analyzer_change:
    to_null: ["NO", "NO2"]
    flag_only: ["CO", "SO2"]
    approx_date: "2019-11-01"
    expected_year: 2019

missing:
  max_gap_h: 24
  eval_gap_lengths_h: [1, 3, 6, 12, 24]
  eval_gaps_per_series: 150
  near_real_gap_h: 24
  seed: 42

aggregation:
  min_hours_per_day: 18
  min_days_per_month_frac: 0.75
  min_annual_coverage: 0.90

sampling:
  fraction: 0.10
  strata: ["station_id", "season"]
  compare_pollutants: ["PM2_5", "PM10", "NO2", "O3"]
  seed: 42

eaqi:
  source: "https://airindex.eea.europa.eu/AQI/index.html"
  labels: ["good", "fair", "moderate", "poor", "very poor", "extremely poor"]
  bins: {PM2_5: [5, 15, 50, 90, 140]}

features:
  lags_h: [1, 24]
  rolling_h: 24
  lag_pollutants: ["PM2_5", "PM10", "NO2"]
  n_bins: 5
  selection_sample: 50000
  selection_min_gain: 0.001
  tree_max_depth: 8
  seed: 42

reduction:
  corr_threshold: 0.9
  pca_variance: 0.90

binarization:
  pm10_daily_limit: 50
  pm25_daily_who: 15

chi2:
  alpha: 0.05
